name: Smoke test Windows background agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/ClosePilot-Agent.ps1'
      - '.github/workflows/agent-smoke.yml'

jobs:
  agent:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Start and verify agent heartbeat
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'ClosePilot'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $agent = Join-Path $root 'ClosePilot-Agent.ps1'
          Copy-Item -LiteralPath 'assets/ClosePilot-Agent.ps1' -Destination $agent -Force
          $config = @{
            monitorEnabled = $true
            autoStart = $false
            graceSeconds = 5
            pollSeconds = 2
            apps = @(@{id='chrome';label='Chrome';names=@('chrome');enabled=$true})
          } | ConvertTo-Json -Depth 5
          Set-Content -LiteralPath (Join-Path $root 'config.json') -Value $config -Encoding utf8
          Copy-Item -LiteralPath 'assets/ClosePilot-Setup.ps1' -Destination (Join-Path $root 'ClosePilot-Setup.ps1') -Force
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'ClosePilot-Setup.ps1') -Action start-agent
          $p = Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" | Where-Object { $_.CommandLine -like '*ClosePilot-Agent.ps1*' } | Select-Object -First 1
          if (-not $p) { throw "PowerShell bootstrap did not start agent" }
          try {
            Write-Output "Agent process PID: $($p.ProcessId)"
            $status = Join-Path $root 'status.json'
            $fatal = Join-Path $root 'agent-fatal.log'
            $previous = $null
            $observedPids = @()
            for ($i = 1; $i -le 5; $i++) {
              Start-Sleep -Seconds 5
              if (-not (Test-Path $status)) { throw "No heartbeat after interval $i" }
              $s = Get-Content $status -Raw | ConvertFrom-Json
              $dt = [DateTimeOffset]::Parse($s.updatedAt)
              Write-Output ("Heartbeat {0}: PID {1}, updated {2}" -f $i, $s.agentPid, $dt)
              $observedPids += $s.agentPid
              if ($previous -and $dt -le $previous) {
                if (Test-Path (Join-Path $root 'status.tmp')) {
                  Write-Output "Pending status.tmp detected:"
                  Get-Item (Join-Path $root 'status.tmp') | Select-Object Length,LastWriteTime | Format-List
                }
                throw "Heartbeat stopped advancing: previous $previous; current $dt"
              }
              $previous = $dt
            }
            if (@($observedPids | Select-Object -Unique).Count -ne 1) { throw "Agent PID changed" }
            if ($s.version -ne '1.2.4') { throw "Unexpected version: $($s.version)" }
            $events = Join-Path $root 'events.jsonl'
            if (Test-Path $events) { Get-Content $events -Tail 8 }
            $writeErrors = Join-Path $root 'status-write-errors.log'
            if (Test-Path $writeErrors) { Get-Content $writeErrors; throw "Heartbeat writer errors occurred" }
            if (Test-Path $fatal) { Get-Content $fatal; throw "Fatal errors in agent log" }
            # Starting the app again must preserve a healthy monitor, not spawn duplicates.
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'ClosePilot-Setup.ps1') -Action start-agent
            Start-Sleep -Seconds 3
            $s = Get-Content $status -Raw | ConvertFrom-Json
            if ($s.agentPid -ne $p.ProcessId) { throw "Healthy monitor was unnecessarily replaced" }
            # A missing/stale process must be recoverable without a Windows restart.
            Stop-Process -Id $p.ProcessId -Force -ErrorAction Stop
            Start-Sleep -Milliseconds 500
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'ClosePilot-Setup.ps1') -Action start-agent
            Start-Sleep -Seconds 6
            $replacement = Get-Content $status -Raw | ConvertFrom-Json
            if (($replacement.agentPid -eq $p.ProcessId) -or ($replacement.version -ne '1.2.4')) {
              throw "Replacement monitor did not start"
            }
            if ((Get-Date) - ([DateTimeOffset]::Parse($replacement.updatedAt)).LocalDateTime -gt [TimeSpan]::FromSeconds(8)) {
              throw "Replacement heartbeat is stale"
            }
            Write-Output ("Recovered from stale agent: old PID {0} -> new PID {1}" -f $p.ProcessId,$replacement.agentPid)
          } finally {
            Set-Content (Join-Path $root 'stop.request') 'stop'
            Start-Sleep -Seconds 3
            $agents = @(Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine.IndexOf($agent, [StringComparison]::OrdinalIgnoreCase) -ge 0 })
            foreach ($runningAgent in $agents) {
              Stop-Process -Id $runningAgent.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }
