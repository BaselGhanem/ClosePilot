name: Publish ClosePilot Windows GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'Build-Windows.ps1'
      - 'assets/ClosePilot-Agent.ps1'
      - '.github/workflows/publish-public-release.yml'

permissions:
  contents: write

concurrency:
  group: closepilot-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate version and check existing release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          if ($repo -ne 'BaselGhanem/ClosePilot') {
            throw "Unexpected repository: $repo"
          }
          $pubspec = Get-Content -LiteralPath 'pubspec.yaml' -Raw
          $match = [regex]::Match($pubspec, '(?m)^version:\s*(\d+\.\d+\.\d+)\+\d+\s*$')
          if (-not $match.Success) { throw 'Cannot determine current application version.' }
          $version = $match.Groups[1].Value
          $tag = "v$version"
          $dart = Get-Content -LiteralPath 'lib/update_service.dart' -Raw
          if ($dart -notmatch [regex]::Escape("kClosePilotVersion = '$version'")) {
            throw "Updater version does not match pubspec.yaml ($version)."
          }
          if ($dart -notmatch "kReleaseRepository = 'BaselGhanem/ClosePilot'") {
            throw 'Updater repository must be BaselGhanem/ClosePilot.'
          }
          $existing = gh release view $tag --repo $repo --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists. Not overwriting."
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
            Write-Host "Preparing release $tag for $repo."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # gh release view exits 1 for a new tag; do not leak that exit status into this step.
          exit 0

      - uses: subosito/flutter-action@v2
        if: steps.release.outputs.skip != 'true'
        with:
          channel: stable

      - name: Build Windows executable and run all tests
        if: steps.release.outputs.skip != 'true'
        shell: pwsh
        run: .\Build-Windows.ps1

      - name: Prepare exact release ZIP and SHA-256 checksum
        if: steps.release.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath 'ClosePilot-Windows-Release.zip' -Destination 'ClosePilot-Windows.zip' -Force
          $hash = (Get-FileHash -LiteralPath 'ClosePilot-Windows.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $PWD 'ClosePilot-Windows.zip.sha256'), ($hash + '  ClosePilot-Windows.zip' + [Environment]::NewLine), [System.Text.Encoding]::ASCII)
          Write-Host "SHA-256: $hash"

      - name: Publish to GitHub Releases in the SAME repository
        if: steps.release.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          gh release create $env:RELEASE_TAG 'ClosePilot-Windows.zip' 'ClosePilot-Windows.zip.sha256' --repo $repo --target $env:GITHUB_SHA --title "ClosePilot $env:RELEASE_TAG - Basel Edition" --notes-file 'RELEASE_NOTES.md' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          Write-Host "Release published: https://github.com/$repo/releases/tag/$env:RELEASE_TAG"
